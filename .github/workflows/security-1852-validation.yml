name: Security 1852 validation

on:
  push:
    branches:
      - zz-sol19a/security-1852-ci

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Ruff lint
        run: uv run ruff check memanto/cli/commands/memory_mgmt.py tests/test_dynamic_memory_injection.py

      - name: Ruff format
        run: uv run ruff format --check memanto/cli/commands/memory_mgmt.py tests/test_dynamic_memory_injection.py

      - name: Focused regression
        env:
          MOORCHEH_API_KEY: test-api-key
        run: uv run pytest -q tests/test_dynamic_memory_injection.py
