name: Memanto 1852 repaired current-head gate

on:
  push:
    branches:
      - validation/sol-mc-packager-08-memanto-fa8c6a5-20261005

permissions:
  contents: read

jobs:
  repaired-current-head-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_HEAD: f6c7885406c233bdb5c6f12eafe33d86a8cdf511
      MOORCHEH_API_KEY: test-api-key

    steps:
      - name: Check out exact repaired PR carrier
        uses: actions/checkout@v4
        with:
          ref: fix/1852-local-sync-scope-20260920
          fetch-depth: 2

      - name: Prove repaired source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD"
          test "$(git rev-parse HEAD^)" = "fa8c6a5d2f6c0f953bb88d2dacf388f5ab01b8c7"
          mkdir -p artifacts
          {
            echo "source_head=$(git rev-parse HEAD)"
            echo "source_parent=$(git rev-parse HEAD^)"
            echo "source_tree=$(git rev-parse HEAD^{tree})"
            echo "changed_paths:"
            git diff --name-only HEAD^ HEAD
          } | tee artifacts/source-identity.txt
          test "$(git diff --name-only HEAD^ HEAD | sort)" = "$(printf '%s\n' tests/test_export_resilience.py tests/test_okf.py tests/test_unit.py | sort)"

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install repository dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -VV 2>&1 | tee artifacts/python-version.txt
          uv --version 2>&1 | tee artifacts/uv-version.txt
          uv sync --all-extras --dev 2>&1 | tee artifacts/uv-sync.log

      - name: Create version fallback
        shell: bash
        run: echo '__version__ = "0.0.0.dev0"' > memanto/app/_version.py

      - name: Run repository-native full test suite once
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          uv run pytest tests/ -q --tb=short --junitxml=artifacts/pytest.xml 2>&1 | tee artifacts/pytest.log

      - name: Upload final validation receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memanto-1852-current-head-f6c7885
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
